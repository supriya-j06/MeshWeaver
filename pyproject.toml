[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "meshweaver"
version = "1.0.0"
description = "Decentralised P2P async task broker (Kademlia DHT, gossip, cloudpickle)"
requires-python = ">=3.9"
dependencies = ["cloudpickle>=3.0", "psutil>=5.9", "cryptography>=42.0", "rich>=13.0"]

[project.scripts]
meshweaver = "meshweaver.cli:main"

[tool.setuptools]
packages = ["meshweaver"]
